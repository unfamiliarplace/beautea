<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Beautea</title>
  <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.14.1/themes/smoothness/jquery-ui.css">
<link rel="stylesheet" href="https://g.sawczak.com/web-tools/css/app-base.css">
  <link rel="stylesheet" href="./style.css">

  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">

</head>

<body>
  <div id='app'>
    <div id='mainPanel'>
      <div id='gamePanel' class='fullPanel'>
        <div id='titlePanel'>
          <h1 id='title'>Beautea</h1>
        </div>
        <div id='focusPanel' class='flexRow'>
          <div id='drinksPanel' class='flexRow'></div>
          <div id='drinkInfoPanel' class='hide flexCol'>
            <div id='drinkInfoNav' class='flexRow drinkOptionsRow drinkNav'>
              <div id='drinkInfoDrink'></div>
              <div id='drinkOptions' class="flexCol">
                <div id="drinkOptionsTop" class="drinkOptionsSubrow flexRow">
                  <button id='btnSmall' data-value="small" class="btnSize buttonBase buttonEffects">Small</button>
                  <button id='btnLarge' data-value="large" class="btnSize buttonBase buttonEffects">Large</button>
                </div>
                <div id="drinkOptionsBottom" class="drinkOptionsSubrow flexRow">
                  <button id='btnCold' data-value="cold" class="btnTemp buttonBase buttonEffects">Cold</button>
                  <button id='btnHot' data-value="hot" class="btnTemp buttonBase buttonEffects">Hot</button>
                </div>
              </div>
              <div id='drinkInfoBack'>
                <button id='btnInfoBack' class=" buttonBase buttonEffects">&lt;</button>
              </div>
            </div>
          </div>
        </div>

      </div>
      <div id="helpPanel" class="hide fullPanel verticalPanel overlayPanel">
        <div id="helpContent" class="panelContent">
          <h1>Help</h1>
          <hr />
          <p>Coming soon</p>
        </div>
      </div>
    </div>
    <div id='footer'>
      <div id='footerContent'>
        <div class='footerBlock' id='footerLeft'>
          <!-- <div id='resetButtonContainer'><button id='btnReset' class='buttonBase buttonEffects buttonFooter' title='Reset all settings'>Reset</button></div>
        <div id='restartButtonContainer'><button id='btnRestart' class='buttonBase buttonEffects buttonFooter' title='Restart stats'>Restart</button></div> -->

        </div>
        <div class='footerBlock' id='footerRight'>
          <div id='helpButtonContainer'><button id='btnHelp' class='buttonBase buttonEffects buttonFooter'
              title='Show/hide help panel'>Help</button></div>
          <div id="copyrightContainer">
            <div id="copyright">© 2026 <a href="https://sawczak.com">Luke Sawczak</a></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.14.1/jquery-ui.min.js"></script>
  <script src='https://g.sawczak.com/web-tools/js/toolbox.js'></script>
  <script src='https://g.sawczak.com/web-tools/js/jquery-ui-options.js'></script>
  <script src="https://kit.fontawesome.com/f8cd0a77d9.js" crossorigin="anonymous"></script>
  <script src="data/drinkData.js"></script>

  <script src="./script.js"></script>

</body>

</html>
